<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#080809"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4151"/>
      <stop offset="100%" stop-color="#bd0c22"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1f"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g stroke="#242125" stroke-width="1" opacity="0.6">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Red Accent Ambient Light -->
  <circle cx="1020" cy="180" r="160" fill="#e32b3c" opacity="0.12" filter="url(#glow)"/>
  <circle cx="220" cy="500" r="200" fill="#e32b3c" opacity="0.08" filter="url(#glow)"/>

  <!-- Top bar info -->
  <text x="60" y="70" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#ef4151" letter-spacing="3">GENERATIVE AI // APPLICATION PIPELINE</text>
  <text x="1140" y="70" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#a09c9a" text-anchor="end">GROQ LPU · LANGCHAIN · STREAMLIT</text>

  <!-- Main Mockup Container -->
  <rect x="60" y="100" width="1080" height="515" rx="12" fill="url(#cardGrad)" stroke="#2d282c" stroke-width="1.5"/>

  <!-- Mockup Header -->
  <rect x="60" y="100" width="1080" height="48" rx="12" fill="#141418"/>
  <rect x="60" y="136" width="1080" height="12" fill="#141418"/>
  <line x1="60" y1="148" x2="1140" y2="148" stroke="#252126" stroke-width="1"/>
  
  <!-- Window dots -->
  <circle cx="90" cy="124" r="6" fill="#ff5f56"/>
  <circle cx="110" cy="124" r="6" fill="#ffbd2e"/>
  <circle cx="130" cy="124" r="6" fill="#27c93f"/>

  <!-- Mockup URL bar -->
  <rect x="200" y="112" width="600" height="24" rx="6" fill="#0d0d10" stroke="#2a252b" stroke-width="1"/>
  <text x="220" y="128" font-family="'Manrope', monospace" font-size="11" fill="#7d787c">localhost:8501 · Streamlit AI Intelligence Portal</text>

  <!-- Content Left Column: Ingestion & Processing Nodes -->
  <g transform="translate(100, 180)">
    <!-- Node 1: Input Sources -->
    <rect x="0" y="0" width="300" height="85" rx="8" fill="#17171d" stroke="#2a252b" stroke-width="1.2"/>
    <circle cx="36" cy="42" r="18" fill="#e32b3c" opacity="0.15"/>
    <!-- Play / Video icon -->
    <polygon points="32,34 44,42 32,50" fill="#ef4151"/>
    <text x="70" y="36" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#f2efeb">YouTube Video URLs</text>
    <text x="70" y="56" font-family="'Manrope', sans-serif" font-size="12" fill="#a09c9a">Transcript API Extraction</text>

    <!-- Connector Arrow -->
    <line x1="150" y1="85" x2="150" y2="120" stroke="#ef4151" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="146,120 150,126 154,120" fill="#ef4151"/>

    <!-- Node 2: Web Document Ingestion -->
    <rect x="0" y="125" width="300" height="85" rx="8" fill="#17171d" stroke="#2a252b" stroke-width="1.2"/>
    <circle cx="36" cy="167" r="18" fill="#3D9BFF" opacity="0.15"/>
    <text x="36" y="172" font-family="'Manrope', sans-serif" font-size="15" font-weight="700" fill="#3D9BFF" text-anchor="middle">&lt;/&gt;</text>
    <text x="70" y="161" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#f2efeb">Arbitrary Web URLs</text>
    <text x="70" y="181" font-family="'Manrope', sans-serif" font-size="12" fill="#a09c9a">Unstructured HTML Parsers</text>

    <!-- Connector Arrow -->
    <line x1="150" y1="210" x2="150" y2="245" stroke="#ef4151" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="146,245 150,251 154,245" fill="#ef4151"/>

    <!-- Node 3: LangChain Chains & Groq LLM -->
    <rect x="0" y="250" width="300" height="120" rx="8" fill="#17171d" stroke="#ef4151" stroke-width="1.5"/>
    <rect x="0" y="250" width="8" height="120" rx="4" fill="url(#redAccent)"/>
    <text x="24" y="280" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#f2efeb">LangChain Orchestration</text>
    <text x="24" y="302" font-family="'Manrope', sans-serif" font-size="12" fill="#ef4151" font-weight="600">⚡ Groq High-Speed Inference Engine</text>
    <text x="24" y="324" font-family="'Manrope', sans-serif" font-size="11" fill="#a09c9a">Context compression · Adaptive prompt chains</text>
    <text x="24" y="344" font-family="'Manrope', sans-serif" font-size="11" fill="#7d787c">Multi-format structured extraction</text>
  </g>

  <!-- Connecting line from Left to Right -->
  <line x1="430" y1="365" x2="480" y2="365" stroke="#ef4151" stroke-width="2"/>
  <polygon points="480,361 488,365 480,369" fill="#ef4151"/>

  <!-- Content Right Column: Streamlit AI Summarizer Interface Preview -->
  <g transform="translate(490, 180)">
    <rect x="0" y="0" width="600" height="390" rx="10" fill="#0f0f13" stroke="#2d282c" stroke-width="1.2"/>
    
    <!-- Title Inside Mockup -->
    <text x="35" y="45" font-family="'Anton', sans-serif" font-size="28" fill="#f2efeb" letter-spacing="1">CONTENT INTELLIGENCE &amp; SUMMARIZER</text>
    
    <!-- Input box inside mockup -->
    <rect x="35" y="65" width="530" height="42" rx="6" fill="#17171d" stroke="#332c33" stroke-width="1"/>
    <text x="50" y="91" font-family="'Manrope', sans-serif" font-size="13" fill="#a09c9a">https://www.youtube.com/watch?v=example-video-id</text>
    <rect x="475" y="71" width="82" height="30" rx="4" fill="#e32b3c"/>
    <text x="516" y="91" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Summarize</text>

    <!-- Key Metrics & Speed Pill -->
    <g transform="translate(35, 125)">
      <rect x="0" y="0" width="130" height="36" rx="6" fill="#191921"/>
      <text x="14" y="23" font-family="'Manrope', sans-serif" font-size="11" fill="#a09c9a">Inference Time: <tspan fill="#4CD964" font-weight="700">0.82s</tspan></text>
      
      <rect x="145" y="0" width="140" height="36" rx="6" fill="#191921"/>
      <text x="159" y="23" font-family="'Manrope', sans-serif" font-size="11" fill="#a09c9a">Tokens/sec: <tspan fill="#3D9BFF" font-weight="700">450+ T/s</tspan></text>

      <rect x="300" y="0" width="140" height="36" rx="6" fill="#191921"/>
      <text x="314" y="23" font-family="'Manrope', sans-serif" font-size="11" fill="#a09c9a">Compression: <tspan fill="#ef4151" font-weight="700">85%</tspan></text>
    </g>

    <!-- AI Output Box -->
    <rect x="35" y="180" width="530" height="185" rx="8" fill="#15151b" stroke="#252126" stroke-width="1"/>
    <text x="55" y="210" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#ef4151">Executive Summary</text>
    <text x="55" y="235" font-family="'Manrope', sans-serif" font-size="12" fill="#e0dedb" line-height="1.6">
      • Automatic multi-channel extraction parsed 45 minutes of audio transcript in under 2 seconds.
    </text>
    <text x="55" y="260" font-family="'Manrope', sans-serif" font-size="12" fill="#e0dedb">
      • Key concepts segmented into hierarchical bullet points with zero hallucination.
    </text>
    <text x="55" y="285" font-family="'Manrope', sans-serif" font-size="12" fill="#e0dedb">
      • Unstructured documents and web articles processed seamlessly alongside video.
    </text>
    <text x="55" y="315" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#a09c9a">
      Stack: Python · LangChain · Groq API · Streamlit UI · YouTube Transcript API
    </text>
    <rect x="55" y="332" width="95" height="20" rx="3" fill="#2a1a1e"/>
    <text x="102" y="346" font-family="'Manrope', monospace" font-size="10" font-weight="700" fill="#ef4151" text-anchor="middle">STATUS: READY</text>
  </g>
</svg>
