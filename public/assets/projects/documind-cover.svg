<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="dmBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="50%" stop-color="#0c0c0e"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="dmRedAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4151"/>
      <stop offset="100%" stop-color="#bd0c22"/>
    </linearGradient>
    <linearGradient id="dmCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a20"/>
      <stop offset="100%" stop-color="#111115"/>
    </linearGradient>
    <filter id="dmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#dmBgGrad)"/>

  <!-- Subtle grid lines -->
  <g stroke="#242126" stroke-width="1" opacity="0.6">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
  </g>

  <!-- Ambient Light -->
  <circle cx="1040" cy="190" r="170" fill="#e32b3c" opacity="0.11" filter="url(#dmGlow)"/>
  <circle cx="200" cy="480" r="190" fill="#3ECF8E" opacity="0.06" filter="url(#dmGlow)"/>

  <!-- Top bar info -->
  <text x="60" y="70" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#ef4151" letter-spacing="3">MULTIMODAL RAG // FULL-STACK AI PLATFORM</text>
  <text x="1140" y="70" font-family="'Manrope', sans-serif" font-size="14" font-weight="600" fill="#a09c9a" text-anchor="end">NEXT.JS · FASTAPI · QDRANT · SUPABASE</text>

  <!-- Main Mockup Container -->
  <rect x="60" y="100" width="1080" height="515" rx="12" fill="url(#dmCardGrad)" stroke="#2e292d" stroke-width="1.5"/>

  <!-- Mockup Header -->
  <rect x="60" y="100" width="1080" height="48" rx="12" fill="#141418"/>
  <rect x="60" y="136" width="1080" height="12" fill="#141418"/>
  <line x1="60" y1="148" x2="1140" y2="148" stroke="#252126" stroke-width="1"/>
  
  <!-- Window dots -->
  <circle cx="90" cy="124" r="6" fill="#ff5f56"/>
  <circle cx="110" cy="124" r="6" fill="#ffbd2e"/>
  <circle cx="130" cy="124" r="6" fill="#27c93f"/>

  <!-- Mockup URL bar -->
  <rect x="200" y="112" width="600" height="24" rx="6" fill="#0d0d10" stroke="#2a252b" stroke-width="1"/>
  <text x="220" y="128" font-family="'Manrope', monospace" font-size="11" fill="#7d787c">documind-ai.vercel.app · Page-Aware Workspace</text>

  <!-- Left Column: Pipeline Architecture Nodes -->
  <g transform="translate(100, 180)">
    <!-- Node 1: Multimodal Ingestion -->
    <rect x="0" y="0" width="310" height="85" rx="8" fill="#17171d" stroke="#2a252b" stroke-width="1.2"/>
    <circle cx="36" cy="42" r="18" fill="#e32b3c" opacity="0.15"/>
    <text x="36" y="47" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#ef4151" text-anchor="middle">PDF</text>
    <text x="70" y="36" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#f2efeb">Multimodal Ingestion</text>
    <text x="70" y="56" font-family="'Manrope', sans-serif" font-size="12" fill="#a09c9a">PDF, DOCX &amp; OCR Image Parsing</text>

    <!-- Connector Arrow -->
    <line x1="155" y1="85" x2="155" y2="120" stroke="#ef4151" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="151,120 155,126 159,120" fill="#ef4151"/>

    <!-- Node 2: Page-Aware Vector Search -->
    <rect x="0" y="125" width="310" height="85" rx="8" fill="#17171d" stroke="#2a252b" stroke-width="1.2"/>
    <circle cx="36" cy="167" r="18" fill="#EF3956" opacity="0.15"/>
    <text x="36" y="172" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#EF3956" text-anchor="middle">QD</text>
    <text x="70" y="161" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#f2efeb">Qdrant Vector DB</text>
    <text x="70" y="181" font-family="'Manrope', sans-serif" font-size="12" fill="#a09c9a">Page-Level Metadata Filtering</text>

    <!-- Connector Arrow -->
    <line x1="155" y1="210" x2="155" y2="245" stroke="#ef4151" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="151,245 155,251 159,245" fill="#ef4151"/>

    <!-- Node 3: AI Gateway & Routing -->
    <rect x="0" y="250" width="310" height="120" rx="8" fill="#17171d" stroke="#ef4151" stroke-width="1.5"/>
    <rect x="0" y="250" width="8" height="120" rx="4" fill="url(#dmRedAccent)"/>
    <text x="24" y="280" font-family="'Manrope', sans-serif" font-size="14" font-weight="700" fill="#f2efeb">Multi-Tier AI Routing</text>
    <text x="24" y="302" font-family="'Manrope', sans-serif" font-size="12" fill="#ef4151" font-weight="600">⚡ Groq Primary · Gemini Fallback</text>
    <text x="24" y="324" font-family="'Manrope', sans-serif" font-size="11" fill="#a09c9a">FastAPI BackgroundTasks &amp; SSE Stream</text>
    <text x="24" y="344" font-family="'Manrope', sans-serif" font-size="11" fill="#7d787c">Supabase RLS Data Isolation</text>
  </g>

  <!-- Connecting line from Left to Right -->
  <line x1="435" y1="365" x2="480" y2="365" stroke="#ef4151" stroke-width="2"/>
  <polygon points="480,361 488,365 480,369" fill="#ef4151"/>

  <!-- Right Column: DocuMind AI Interactive Interface Preview -->
  <g transform="translate(490, 180)">
    <rect x="0" y="0" width="600" height="390" rx="10" fill="#0f0f13" stroke="#2d282c" stroke-width="1.2"/>
    
    <!-- Title Inside Mockup -->
    <text x="35" y="45" font-family="'Anton', sans-serif" font-size="28" fill="#f2efeb" letter-spacing="1">DOCUMIND AI WORKSPACE</text>
    
    <!-- Document query input -->
    <rect x="35" y="65" width="530" height="42" rx="6" fill="#17171d" stroke="#332c33" stroke-width="1"/>
    <text x="50" y="91" font-family="'Manrope', sans-serif" font-size="13" fill="#a09c9a">"Compare the financial metrics on page 4 and page 12"</text>
    <rect x="480" y="71" width="76" height="30" rx="4" fill="#e32b3c"/>
    <text x="518" y="91" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Query</text>

    <!-- Key Metrics & Benchmark Pill -->
    <g transform="translate(35, 125)">
      <rect x="0" y="0" width="135" height="36" rx="6" fill="#191921"/>
      <text x="14" y="23" font-family="'Manrope', sans-serif" font-size="11" fill="#a09c9a">Citation Match: <tspan fill="#4CD964" font-weight="700">100%</tspan></text>
      
      <rect x="150" y="0" width="135" height="36" rx="6" fill="#191921"/>
      <text x="164" y="23" font-family="'Manrope', sans-serif" font-size="11" fill="#a09c9a">Streaming TTFT: <tspan fill="#3D9BFF" font-weight="700">0.42s</tspan></text>

      <rect x="300" y="0" width="145" height="36" rx="6" fill="#191921"/>
      <text x="314" y="23" font-family="'Manrope', sans-serif" font-size="11" fill="#a09c9a">Hallucination: <tspan fill="#ef4151" font-weight="700">0.0%</tspan></text>
    </g>

    <!-- Grounded AI Answer Box with Inline Citations -->
    <rect x="35" y="180" width="530" height="185" rx="8" fill="#15151b" stroke="#252126" stroke-width="1"/>
    <text x="55" y="210" font-family="'Manrope', sans-serif" font-size="13" font-weight="700" fill="#ef4151">Grounded Synthesis with Page Citations</text>
    <text x="55" y="235" font-family="'Manrope', sans-serif" font-size="12" fill="#e0dedb">
      • Net Revenue reached $4.2M representing 34% YoY growth <tspan fill="#ef4151" font-weight="700">[Page 4 §2]</tspan>.
    </text>
    <text x="55" y="260" font-family="'Manrope', sans-serif" font-size="12" fill="#e0dedb">
      • Operating expenditures decreased by 12% following cloud consolidation <tspan fill="#ef4151" font-weight="700">[Page 12 §4]</tspan>.
    </text>
    <text x="55" y="285" font-family="'Manrope', sans-serif" font-size="12" fill="#e0dedb">
      • Cross-document verification confirmed zero hallucinations across all extracted tables.
    </text>
    <text x="55" y="315" font-family="'Manrope', sans-serif" font-size="11" font-weight="600" fill="#a09c9a">
      Stack: Next.js · FastAPI · Qdrant Cloud · Supabase RLS · Groq &amp; Gemini LLMs
    </text>
    <rect x="55" y="332" width="105" height="20" rx="3" fill="#1a251e"/>
    <text x="107" y="346" font-family="'Manrope', monospace" font-size="10" font-weight="700" fill="#4CD964" text-anchor="middle">VERIFIED CITATIONS</text>
  </g>
</svg>

